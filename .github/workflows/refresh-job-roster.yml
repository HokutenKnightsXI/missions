name: Refresh HorizonXI job roster

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-horizon-job-roster
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out roster refresh script
        uses: actions/checkout@v4
      - name: Fetch current job levels and update the website
        env:
          ROSTER_BASE_URL: https://hokutenknights.com
          ROSTER_REFRESH_TOKEN: ${{ secrets.ROSTER_REFRESH_TOKEN }}
        run: python github_refresh_horizon_jobs.py
